[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = false
fuzz = { runs = 512 }
invariant = { runs = 256, depth = 32 }

[profile.default.fmt]
line_length = 100
tab_width = 4

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options